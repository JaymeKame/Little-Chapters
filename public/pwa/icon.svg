<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Little Chapters">
  <title>Little Chapters</title>
  <!--
    Little Chapters app identity (correction sprint Section 24). Read as a
    magical STORY PORTAL, not a textbook. An open storybook whose center
    becomes a warm doorway/path into an adventure, with one Little Chapters
    star. No child face, no letters, no logo type; recognizable at 60 px and
    still simple at 192/512. Colors from tokens in app/globals.css: Leaf
    #2E7D63, Sunshine #F4C95D, Sky #7EB7E6, Stone #F5EFE6, Ink #2B2B2B.
  -->
  <defs>
    <radialGradient id="portal" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#FFF6D6"/>
      <stop offset="46%" stop-color="#F4C95D"/>
      <stop offset="82%" stop-color="#E7A55A"/>
      <stop offset="100%" stop-color="#B87830"/>
    </radialGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFCF1"/>
      <stop offset="100%" stop-color="#F0E7D0"/>
    </linearGradient>
    <linearGradient id="cover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C9C7C"/>
      <stop offset="100%" stop-color="#245B47"/>
    </linearGradient>
    <linearGradient id="path" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#F4C95D"/>
      <stop offset="100%" stop-color="#FFF6D6"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- warm background — full-bleed so the icon reads well against dark and
       light home-screen wallpapers alike; maskable safe zone kept clear -->
  <rect x="0" y="0" width="512" height="512" fill="#F5EFE6"/>

  <!-- soft ambient glow behind the portal -->
  <circle cx="256" cy="252" r="200" fill="#F4C95D" opacity="0.22" filter="url(#soft)"/>

  <!-- book cover (green) — reads as a book from far, as a portal from near -->
  <g>
    <path d="M52 380
             C 52 210, 130 132, 256 132
             C 382 132, 460 210, 460 380
             L 460 430
             C 460 442, 450 452, 438 452
             L 74 452
             C 62 452, 52 442, 52 430 Z"
          fill="url(#cover)"/>

    <!-- spine crease -->
    <path d="M256 132 L 256 452" stroke="#183A2E" stroke-width="4" stroke-linecap="round" opacity="0.42"/>

    <!-- left page -->
    <path d="M76 396
             C 84 240, 156 172, 256 168
             L 256 432
             C 176 432, 118 420, 88 412
             C 82 410, 78 404, 76 396 Z"
          fill="url(#paper)"/>

    <!-- right page -->
    <path d="M436 396
             C 428 240, 356 172, 256 168
             L 256 432
             C 336 432, 394 420, 424 412
             C 430 410, 434 404, 436 396 Z"
          fill="url(#paper)"/>

    <!-- portal well at the center of the spread (the doorway) -->
    <ellipse cx="256" cy="308" rx="126" ry="132" fill="url(#portal)"/>

    <!-- small path receding into the portal — the "adventure" cue -->
    <path d="M256 428
             L 288 336
             L 268 260
             L 256 210
             L 244 260
             L 224 336 Z"
          fill="url(#path)" opacity="0.92"/>

    <!-- rolling hills silhouette on the horizon inside the portal -->
    <path d="M148 288
             C 178 260, 208 258, 232 274
             C 250 262, 268 262, 286 274
             C 310 258, 340 260, 370 288
             L 370 340
             L 148 340 Z"
          fill="#245B47" opacity="0.32"/>

    <!-- a single Little Chapters spark, off-center — never centered on the
         page seam or it reads as an asterisk -->
    <g transform="translate(370 168)">
      <path d="M0 -22 L6 -6 L22 0 L6 6 L0 22 L-6 6 L-22 0 L-6 -6 Z" fill="#F4C95D"/>
      <circle cx="0" cy="0" r="3" fill="#FFF6D6"/>
    </g>
    <g transform="translate(410 210)" opacity="0.78">
      <path d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z" fill="#F7DCA2"/>
    </g>

    <!-- warm rim on the cover so the book has weight, not sticker-flat -->
    <path d="M52 430
             C 52 442, 62 452, 74 452
             L 438 452
             C 450 452, 460 442, 460 430
             L 460 414
             C 400 428, 320 434, 256 434
             C 192 434, 112 428, 52 414 Z"
          fill="#183A2E" opacity="0.28"/>
  </g>
</svg>
